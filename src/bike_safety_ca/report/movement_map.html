<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crash Movement Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f5f2;--fg:#1d2126;--muted:#5d646c;--line:#d5d3cd;--panel:#ffffff;--warn-bg:#fff3d6;--warn-fg:#5c4300;
--bicycle:#d1382c;--car:#2563c9;--child:#0e8a7d;--moto:#8b3fc4;--ped:#b8860b;--other:#5b6470;
--sev1:#1a1a1a;--sev2:#a3171c;--sev3:#e07b24;--sev4:#e9c46a;--sev0:#b9b9b9;--dark:#1f3a8a;--hi:#ffe066}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.warn{background:var(--warn-bg);color:var(--warn-fg);padding:6px 16px;font-weight:600;font-size:13px}
header{padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:16px;margin:0 8px 0 0}
label{display:inline-flex;gap:5px;align-items:center;color:var(--muted);font-size:13px}
select,input[type=number]{font:inherit;padding:2px 4px}input[type=number]{width:5em}
button{font:inherit;padding:3px 10px;border:1px solid var(--line);border-radius:5px;background:var(--panel);cursor:pointer}button:hover{background:var(--bg)}
#count{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
main{flex:1;display:flex;min-height:0}
#map{flex:1;min-height:300px;background:#e6e3dc}
.sl span{position:absolute;white-space:nowrap;font-size:11px;color:#4a4f55;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;pointer-events:none}
#panel{width:400px;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:10px 14px;font-size:12.5px}
#panel h2{font-size:13px;margin:12px 0 4px}#panel h2:first-child{margin-top:0}
#panel table{border-collapse:collapse;width:100%}#panel td,#panel th{text-align:left;vertical-align:top;padding:2px 6px 2px 0;border-bottom:1px solid #eeece8}
#panel th{font-weight:600;color:var(--muted)}#panel .n{text-align:right;font-variant-numeric:tabular-nums}
#panel .note{color:var(--muted)}
#panel table.st{table-layout:fixed}#panel table.st th{font-size:11.5px;line-height:1.25;vertical-align:bottom}#panel table.st th.n{width:50px}#panel table.st th.n:first-child{width:54px}
#panel tr.top td{border-bottom:0;padding-bottom:0}#panel tr.sub td{color:var(--muted);padding-top:0}
#panel .picked{margin:6px 0;padding:5px 8px;background:var(--hi);border-radius:5px}#panel .picked button{margin-top:3px;font-size:12px}
.pat{cursor:pointer}.pat:hover td{background:var(--bg)}.pat.on td{background:var(--hi)}
.sevdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
#ptitle,#pkey{display:none}
.leaflet-control-layers{font-size:12px}
.leaflet-tile-pane{filter:grayscale(1) contrast(.85) brightness(1.08)}
.legend{background:var(--panel);padding:8px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.5}
.legend .kb{max-width:220px}.legend .k1{max-width:min(460px,60vw);margin-top:3px}.legend .k1:empty,.legend details[open]~.k1{display:none}.legend .k1 span{white-space:nowrap;margin-right:8px}.legend .k1 .sw{margin-right:4px}
.legend b{display:block;margin-top:4px}.legend b:first-child{margin-top:0}
.legend summary{cursor:pointer;font-weight:700;list-style-position:inside}.legend details[open] summary{margin-bottom:4px}
.legend .kb{max-height:calc(100vh - 260px);overflow-y:auto}
.sw{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend svg{vertical-align:middle;margin-right:4px}
.cr{background:none;border:none}.cr svg{overflow:visible;pointer-events:none}.cr .hit{pointer-events:all;cursor:pointer}
.ct{background:none;border:none;font-size:11px;font-weight:700;color:#333;text-align:center;line-height:1;text-shadow:0 0 2px #fff,0 0 2px #fff}
.pop h3{margin:0 0 4px;font-size:14px}.pop table{border-collapse:collapse;margin-top:6px}.pop td{padding:2px 8px 2px 0;vertical-align:top;font-size:12.5px}
.pop .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pop .meta{color:var(--muted);font-size:12.5px}
@media (max-width:760px){main{flex-direction:column}#map{min-height:60vh}#panel{width:auto;border-left:0;border-top:1px solid var(--line);max-height:40vh}}
body.printing main{display:block}
body.printing #map{width:10.2in;height:5.5in;flex:none;border:1px solid #999}
body.printing .leaflet-control-attribution{display:none}
@media print{
  @page{size:landscape;margin:.35in}
  html,body{height:auto;display:block;background:#fff}
  header,.leaflet-control-layers,.leaflet-control-zoom{display:none!important}
  #ptitle{display:block;margin:0 0 6px;font-size:12px}#ptitle h1{font-size:15px;margin:0 0 2px}
  .warn{padding:4px 8px}
  main{display:block}
  #map{width:10.2in;height:5.5in;flex:none}
  #panel{width:auto;max-height:none;overflow:visible;border:0;padding:8px 0 0;font-size:11px}
  #panel tr{break-inside:avoid}
  .leaflet-popup-pane,.leaflet-control-container .legend{display:none!important}
  #pkey{display:block;columns:4;column-gap:14px;font-size:10px;line-height:1.3;margin-top:5px}
  #panel h2{break-after:avoid}
  #pkey b{display:block;margin-top:3px;break-after:avoid}#pkey svg{vertical-align:middle;margin-right:3px}
  #pkey .sw{display:inline-block;width:14px;height:4px;margin-right:4px;vertical-align:middle}
}
</style></head><body>
<div class="warn">/*WARN*/</div>
<div id="ptitle"><h1>Cyclist crashes, /*CITY*/</h1><div id="pfilters"></div><div class="note">Data: Streets &copy; OpenStreetMap contributors (ODbL). /*CREDIT*/.</div></div>
<header>
<h1>Crash movement map</h1>
<label>Cyclists <select id="who"><option value="all">all ages</option><option value="child">/*CHILD*/</option><option value="adult">adult</option></select></label>
<label>Area <select id="area"><option value="la">/*CITY*/</option><option value="all">whole area</option></select></label>
<label>Years <input type="number" id="y0"> to <input type="number" id="y1"></label>
<label><input type="checkbox" id="com"> school commute hours only</label>
<label>Other party <select id="mv"><option value="">any movement</option><option value="turn">turning</option><option value="straight">going straight</option><option value="still">stopped or parked</option><option value="solo">no other party</option></select></label>
<label>Wrong side <select id="ws"><option value="">any</option><option value="coded">riding, coded for the cyclist</option><option value="inf">riding, suggested by movements only</option><option value="either">riding, coded or suggested</option><option value="unclear">cited, party unclear</option></select></label>
<label><input type="checkbox" id="dk"> after dark only</label>
<button id="print" type="button">Print this view</button>
<span id="count"></span>
</header>
<main><div id="map"></div><div id="pkey"></div><aside id="panel"></aside></main>
<script>
const DATA=/*DATA*/;const MOVE=/*MOVE*/;const SITES=/*SITES*/;const SEV=/*SEVERITY*/;const LIGHT=/*LIGHT*/;const DARK=/*DARK*/;
const SITE={};for(const s of SITES)SITE[s.i]=s;
const COL={"bicycle":"--bicycle","car or truck":"--car","motorcycle":"--moto","pedestrian":"--ped","bus or other":"--other"};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const sevc=v=>css("--sev"+(SEV[v]?v:"0")),dark=r=>DARK.includes(r.lt);
const TURN={D:"R",E:"L",M:"T",F:"U"},STILL={A:1,O:1},L=34;
const KERB={L:"out",K:"in"},DRIFT={J:1,P:1},LEAD={A:1,H:1}; // KERB: entering traffic or parking, from or to the kerb; DRIFT: changing lanes or merging; LEAD: stopped or slowing, so ahead in a rear end
// Zoom levels: 0 intersections sized by their crashes, 1 one dot per crash, 2 collision diagrams.
const level=()=>{const z=map.getZoom();return z<=14?0:z<=16?1:2;},LEVEL=["city","neighbourhood","intersection"];
function glyph(p,i,n){
  const c=css(COL[p.k]||"--other"),w=p.k==="bicycle"?3:2.4;
  if(p.b===null){ // no direction recorded: ring beside the centre
    const a=i*2*Math.PI/Math.max(n,1),x=(9*Math.cos(a)).toFixed(1),y=(9*Math.sin(a)).toFixed(1);
    return `<circle cx="${x}" cy="${y}" r="4.5" fill="#fff" stroke="${c}" stroke-width="2.4"/>`;}
  const dash=p.m==="G"?' stroke-dasharray="4 3"':"",t=TURN[p.m];let d,head;
  if(STILL[p.m]){ // stopped or parked: short stub ending in a bar
    return `<g transform="rotate(${p.b}) translate(${p.o||4},0)"><path d="M0,${L-8} L0,14" stroke="#fff" stroke-width="${w+2.5}" stroke-linecap="round" fill="none"/><path d="M0,${L-8} L0,14" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"/><rect x="-6" y="8" width="12" height="5" rx="1" fill="${c}" stroke="#fff" stroke-width="1.2"/>${p.f?`<circle cx="0" cy="${L-8}" r="3.6" fill="${c}" stroke="#fff" stroke-width="1.2"/>`:""}</g>`;}
  if(t==="R"){d=`M0,${L} L0,12 Q0,2 12,2`;head="M12,-3 L21,2 L12,7 Z";}
  else if(t==="L"){d=`M0,${L} L0,12 Q0,2 -12,2`;head="M-12,-3 L-21,2 L-12,7 Z";}
  else if(t==="U"){d=`M0,${L} L0,10 A5 5 0 0 0 -10,10 L-10,18`;head="M-15,18 L-10,27 L-5,18 Z";}
  else if(t==="T"){d=`M0,${L} L0,12 M-12,4 Q0,2 0,12 Q0,2 12,4`;head="";} // a turn, side not recorded: a fork
  else if(p.m==="-"){d=`M0,${L} L0,6`;head="M-5,5 L5,5 L5,8 L-5,8 Z";} // movement not stated: no arrowhead, a flat end
  else{d=`M0,${L} L0,8`;head="M-5,9 L0,-1 L5,9 Z";}
  return `<g transform="rotate(${p.b}) translate(${p.o||4},0)"><path d="${d}" stroke="#fff" stroke-width="${w+2.5}" stroke-linecap="round" fill="none"/><path d="${head}" fill="#fff" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/><path d="${d}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" fill="none"${dash}/><path d="${head}" fill="${c}"/>${p.f?`<circle cx="0" cy="${L}" r="3.6" fill="${c}" stroke="#fff" stroke-width="1.2"/>`:""}</g>`;
}
// Collision diagrams. Each road user follows a path in its own right-hand lane through a
// schematic intersection turned to the real streets and sized to them: each street is as
// wide as its mapped lanes (movement.half_widths), a cyclist rides near the kerb, a parked
// vehicle sits at it, a motor vehicle turning right comes from the right-hand lane, one
// turning left from the lane by the centre line, and others from the middle of their half.
// A party is put on the other side only where the record says so (movement "travelling
// wrong way" or "crossed into opposing lane", or a cyclist whose wrong-side riding is coded
// or suggested by the movements) or where only that makes the movements meet (see plan).
// Coded means a cyclist's own movement is "travelling wrong way", or the cause is wrong side
// of road and that cyclist is the party at fault (p.wr); only that cyclist is moved.  A
// wrong-side cause with no such cyclist (r.wu) moves nobody, and in a crash that is coded or
// cited no cyclist is put against traffic to make the movements meet.  "Crossed into
// opposing lane" is drawn across the centre line and is not wrong-side riding.
// The crash is drawn where the cyclist's path first meets the other party's. Lanes are
// assumed, not recorded. Sizes are metres from the centre.
const ROAD=10,RUN=60,TRAIL=46,CLOSE=5,GAP=4,BESIDE=5,BEHIND=7,EDGE=1e-6; // ROAD: half width where no street is mapped; GAP: pixels between a drawn cyclist and the lane they are given; BESIDE: pixels (plus GAP) between a cyclist and a road user making the same movement the same way; BEHIND: pixels a rear-ending party's arrow stops short of the one it hit; CLOSE: parallel paths this near meet (rear end, sideswipe, door), or anywhere in the same half of a wider road; EDGE: slack in the geometry tests, so a path ending exactly on another, or two points that tie, sort the same way on every compass bearing
const scale=()=>Math.pow(2,map.getZoom())/(156543.03*Math.cos(map.getCenter().lat*Math.PI/180)); // pixels per metre
function legs(r){return r.si!==null&&r.si!==undefined&&SITE[r.si]?SITE[r.si].w||[]:r.w||[];}
function half(W,b,along){ // half width of the street a party on bearing b travels along (or crosses)
  // A street is often several mapped ways at a corner (a median, turn lanes); the widest counts.
  const sep=lb=>{const d=((lb-b)%180+180)%180;return Math.min(d,180-d);}; // 0 parallel, 90 square
  const most=Math.max(...W.map(([lb])=>sep(lb)),0);
  const hs=W.filter(([lb])=>along?sep(lb)<=30:sep(lb)>30&&sep(lb)>=most-30).map(([,h])=>h);
  return hs.length?Math.max(...hs):ROAD;
}
function lane(k,m,h){ // distance of a party's path from the centre line of a street of half width h
  const o=k==="bicycle"?h-1.5:m==="O"?h-1:TURN[m]==="R"?h-3.5:TURN[m]==="L"?1.7:(h-2)/2;
  return Math.max(1.5,Math.min(o,h-0.5));
}
function against(p,r){return p.m==="Q"||p.m==="N"||(p.k==="bicycle"&&(!!p.wr||!!r.ws));}
function offset(p,r){const o=lane(p.k,p.m,half(legs(r),p.b,true));return against(p,r)?-o:o;}
function route(p,o,k,W,shift=0,exit=null,kerb=null){ // the party's path as points [x,y], screen pixels from the intersection centre; k pixels per metre
  // Drawing only: shift moves the exit lane out (metres), exit sets it, kerb sets the kerb line (default h-1).
  const t=p.b*Math.PI/180,f=[Math.sin(t),-Math.cos(t)],rt=[Math.cos(t),Math.sin(t)];
  const P=(a,b)=>[(a*f[0]+b*rt[0])*k,(a*f[1]+b*rt[1])*k]; // a along the travel, b to the right of it
  const bend=(e,c,x)=>{const out=[];for(let i=0;i<=8;i++){const u=i/8,v=1-u;out.push(P(v*v*e[0]+2*u*v*c[0]+u*u*x[0],v*v*e[1]+2*u*v*c[1]+u*u*x[1]));}return out;};
  // box: half width of the street crossed, own: of the street travelled; a turn leaves in the same kind of lane on the cross street
  const box=half(W,p.b,false),own=half(W,p.b,true),out=Math.sign(o||1)*(exit!==null?exit:lane(p.k,"B",box)+shift),turn=TURN[p.m];
  if(STILL[p.m])return [P(-box-RUN,o),P(-box-4,o)];
  // Pulling out from the kerb (a parking space or driveway), pulling in to park, or moving across: the
  // sideways move is on the approach, so it crosses the line of a cyclist riding along the kerb.
  const kb=Math.sign(o||1)*(kerb!==null?kerb:Math.max(1.5,own-1)),bk=p.k==="bicycle";
  const across=(a,b)=>[P(-box-RUN,a),P(-box-12,a),P(-box-6,b),P(box,b),P(box+RUN,b)]; // steep enough to count as crossing (see meet)
  if(!bk&&KERB[p.m]==="out")return across(kb,o);
  if(!bk&&KERB[p.m]==="in")return [P(-box-RUN,o),P(-box-12,o),P(-box-6,kb),P(-box-4,kb)];
  if(DRIFT[p.m])return across(o,bk?Math.sign(o||1)*Math.max(1.5,(own-2)/2-1):kb); // a cyclist moves out into traffic, a driver over toward the kerb
  if(turn==="R"||turn==="L"){ // leave along the real street on that side (90 degrees where none is mapped)
    const side=turn==="R"?1:-1;let rel=null;
    for(const [lb] of W){const x=side*((((lb-p.b)%360)+540)%360-180);if(x>30&&x<150&&(rel===null||Math.abs(x-90)<Math.abs(rel-90)))rel=x;}
    const f=side*(rel===null?90:rel)*Math.PI/180,d=[Math.cos(f),Math.sin(f)],n=[-Math.sin(f),Math.cos(f)]; // exit direction and its right, in (along, right)
    const sc=(o-out*n[1])/d[1],C=[out*n[0]+sc*d[0],o],sx=Math.max(own,sc+2),X=[out*n[0]+sx*d[0],out*n[1]+sx*d[1]];
    return [P(-box-RUN,o),...bend([Math.min(-box,C[0]-2),o],C,X),P(X[0]+RUN*d[0],X[1]+RUN*d[1])];}
  if(turn==="U")return [P(-box-RUN,o),...bend([-box/2,o],[-box/2+2*Math.abs(o),0],[-box/2,-o]),P(-box-RUN,-o)]; // round to the other side
  // A turn whose side was not recorded goes straight here and ends in a fork (see arrow).
  return [P(-box-RUN,o),P(-box,o),P(box,o),P(box+RUN,o)];
}
function cut(A,i,u){ // A up to fraction u of segment i, without repeated points (an arrowhead needs a last segment of some length)
  const out=[...A.slice(0,i+1),[A[i][0]+u*(A[i+1][0]-A[i][0]),A[i][1]+u*(A[i+1][1]-A[i][1])]];
  return out.filter((q,n)=>n===0||Math.hypot(q[0]-out[n-1][0],q[1]-out[n-1][1])>1e-6);}
function meet(A,B,near,turnA=false,turnB=false,k=1){ // where path A first crosses path B; failing that, their closest approach nearest `near`; k pixels per metre
  // A turning party's crash happens in or after its turn, so a crossing on its approach does not count.
  let best=null;
  for(let i=turnA?1:0;i<A.length-1;i++)for(let j=turnB?1:0;j<B.length-1;j++){
    const [a,b]=[A[i],A[i+1]],[c,d]=[B[j],B[j+1]],den=(b[0]-a[0])*(d[1]-c[1])-(b[1]-a[1])*(d[0]-c[0]);
    if(Math.abs(den)<1e-9)continue;
    // Long straight runs within 30 degrees of each other meet only far down the street, which is not a
    // crash point; the end of a turn may run that close to another path and still cross it.
    const la=Math.hypot(b[0]-a[0],b[1]-a[1]),lb=Math.hypot(d[0]-c[0],d[1]-c[1]);
    if(Math.abs(den)<0.5*la*lb&&la>10*k&&lb>10*k)continue;
    const u=((c[0]-a[0])*(d[1]-c[1])-(c[1]-a[1])*(d[0]-c[0]))/den,v=((c[0]-a[0])*(b[1]-a[1])-(c[1]-a[1])*(b[0]-a[0]))/den;
    if(u>=-EDGE&&u<=1+EDGE&&v>=-EDGE&&v<=1+EDGE&&(!best||i+u<best.i+best.u-EDGE))best={i,u:Math.max(0,Math.min(1,u)),j,v,crossed:true};}
  if(best)return best;
  let score=Infinity;
  for(let i=0;i<A.length-1;i++)for(let j=0;j<B.length-1;j++){
    // The angle between the two segments, 0 when parallel either way.
    const ha=Math.atan2(A[i+1][1]-A[i][1],A[i+1][0]-A[i][0]),hb=Math.atan2(B[j+1][1]-B[j][1],B[j+1][0]-B[j][0]);
    const g=((ha-hb)*180/Math.PI%180+180)%180,sep=Math.min(g,180-g),same=Math.cos(ha-hb)>0;
    for(let s=0;s<=10;s++){const u=s/10,q=[A[i][0]+u*(A[i+1][0]-A[i][0]),A[i][1]+u*(A[i+1][1]-A[i][1])];
      for(let w=0;w<=10;w++){const v=w/10,z=[B[j][0]+v*(B[j+1][0]-B[j][0]),B[j][1]+v*(B[j+1][1]-B[j][1])];
        const d=Math.hypot(q[0]-z[0],q[1]-z[1]),sc=d+0.05*Math.hypot(q[0]-near[0],q[1]-near[1]);
        // A point where a path bends ends one segment and starts the next, with the same score;
        // the more parallel segment wins, whatever the compass bearing.
        if(sc<score-EDGE||(best&&Math.abs(sc-score)<=EDGE&&sep<best.sep-EDGE)){score=sc;best={i,u,j,v,d,sep,same};}}}}
  return best;
}
function rearer(r,bike,others,sameWay){ // drawing a rear end: the party that ran into the other, if the record says which
  if(r.coll!=="rear end")return null;
  const q=others.filter(p=>sameWay(p)&&!TURN[p.m]);
  if(q.length!==1)return null;
  const [a,b]=[bike,q[0]],by=(t)=>t(a)&&!t(b)?a:t(b)&&!t(a)?b:null;
  const ahead=by(p=>!!LEAD[p.m]); // stopped or slowing: the one ahead
  return ahead?(ahead===a?b:a):by(p=>p.f); // otherwise the one at fault
}
function short(A,px){ // A without its last px pixels; unchanged if that would leave too little for an arrowhead
  let left=-px;for(let i=1;i<A.length;i++)left+=Math.hypot(A[i][0]-A[i-1][0],A[i][1]-A[i-1][1]);
  if(left<8)return A;
  const out=[A[0]];
  for(let i=1;i<A.length&&left>0;i++){const d=Math.hypot(A[i][0]-A[i-1][0],A[i][1]-A[i-1][1]);
    if(d>=left){const u=left/d;out.push([A[i-1][0]+u*(A[i][0]-A[i-1][0]),A[i-1][1]+u*(A[i][1]-A[i-1][1])]);left=0;}else{out.push(A[i]);left-=d;}}
  return out;
}
function trail(A,keep){ // the last `keep` pixels of a path
  let left=keep,out=[A[A.length-1]];
  for(let i=A.length-1;i>0&&left>0;i--){const d=Math.hypot(A[i][0]-A[i-1][0],A[i][1]-A[i-1][1]);
    if(d>=left){const u=left/d;out.unshift([A[i][0]+u*(A[i-1][0]-A[i][0]),A[i][1]+u*(A[i-1][1]-A[i][1])]);left=0;}else{out.unshift(A[i-1]);left-=d;}}
  return out;
}
