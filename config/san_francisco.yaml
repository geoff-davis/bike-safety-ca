# A test city for the ranking: San Francisco alone, with the settings of the Los
# Altos case study left as they are (same windows, same child age).
city: San Francisco
county: San Francisco
crash_source: tims+ccrs
# TIMS no longer offers 2014.
first_year: 2015
child_max_age: 18
holdout_windows:
  - [2018, 2019, 2022]
  - [2020, 2021, 2022]
  - [2022, 2023, null]

# UTM zone 10N, metres.
crs: EPSG:26910
ccrs_county_code: 38
ccrs_cities:
  - San Francisco
# The box leaves out the Farallon Islands, which are inside the city limit
# but have no streets.
latitude: [37.6, 37.95]
longitude: [-122.6, -122.3]
