# A pooled test area for the ranking: Seven neighbouring Santa Clara County cities, San Jose among them,
# fitted together, to compare with each city fitted alone. Settings are
# those of the Los Altos case study (same windows, same child age).
# `city` names one of them, the one scored by default: score inside any other by passing
# its outline to the hold-out's --city-limit. Each city's TIMS export goes in
# its own folder under the pool's crashes/tims/.
city: Los Altos
county: Santa Clara
crash_source: tims+ccrs
# TIMS no longer offers 2014.
first_year: 2015
child_max_age: 18
holdout_windows:
  - [2018, 2019, 2022]
  - [2020, 2021, 2022]
  - [2022, 2023, null]

# UTM zone 10N, metres.
crs: EPSG:26910
ccrs_county_code: 43
ccrs_cities:
  - Cupertino
  - Los Altos
  - Los Altos Hills
  - Mountain View
  - Palo Alto
  - San Jose
  - Sunnyvale
latitude: [36.0, 38.5]
longitude: [-123.0, -120.5]
# Reports filed under another agency's code, as in config/los_altos.yaml. From
# 2023 some Los Altos PD (4305) reports carry Palo Alto PD's code (4312); they
# are recognised by a Los Altos beat or a Los Altos city location.
agency_reassignments:
  - {filed_as: "4312", agency: "4305", beat_prefix: LA, city: Los Altos, from_year: 2023}
