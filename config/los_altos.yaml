# Los Altos, fitted together with its five neighbours in Santa Clara County
# and read inside its own limit: on its own it has too few bike crashes for
# the model to be fitted (config/los_altos_city.yaml is the city alone, for
# comparison). A pooled area: name it with --pool in the cross-city check, and
# score inside any other member by passing its outline to the hold-out's
# --city-limit. Each city's TIMS export goes in its own folder under
# crashes/tims/.
#
# To use this for one city, copy config/los_altos_city.yaml instead.
city: Los Altos
county: Santa Clara
crash_source: tims+ccrs
# TIMS no longer offers 2014.
first_year: 2015
child_max_age: 18
holdout_windows:
  - [2018, 2019, 2022]
  - [2020, 2021, 2022]
  - [2022, 2023, null]

# UTM zone 10N, metres.
crs: EPSG:26910
ccrs_county_code: 43
ccrs_cities:
  - Cupertino
  - Los Altos
  - Los Altos Hills
  - Mountain View
  - Palo Alto
  - Sunnyvale
latitude: [36.0, 38.5]
longitude: [-123.0, -120.5]
# Reports filed under another agency's code, as in config/los_altos.yaml. From
# 2023 some Los Altos PD (4305) reports carry Palo Alto PD's code (4312); they
# are recognised by a Los Altos beat or a Los Altos city location.
agency_reassignments:
  - {filed_as: "4312", agency: "4305", beat_prefix: LA, city: Los Altos, from_year: 2023}

# Framings of the crash map printed by `report map --pdf`, each as <name>.pdf.
# `at` is an intersection as the map names it; `centre` is [latitude, longitude].
prints:
  - name: city  # the map's opening view
  - {name: corner-1, at: North San Antonio Road / San Antonio Road / West El Camino Real, zoom: 18}
  - {name: corner-2, at: Foothill Expressway / West Edith Avenue, zoom: 18}
  - {name: corner-3, at: Foothill Expressway / Grant Road / Homestead Road, zoom: 18}
  - {name: corner-4, at: 1st Street / Foothill Expressway / Main Street, zoom: 18}
  - {name: corner-5, at: Casita Way / Jardin Drive, zoom: 18}
