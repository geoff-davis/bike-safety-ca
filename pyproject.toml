[project]
name = "bike-safety-ca"
version = "0.1.0"
description = "Rank intersections for bicycle crash risk from California police crash records"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Geoff Davis" }]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "httpx>=0.27",
    "markdown>=3.11.3",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
    "scipy>=1.13",
    "shapely>=2.0",
    "statsmodels>=0.14.2",
    "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bike_safety_ca"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hung test fails instead of running to the CI job cap, and dumps stacks.
# CI runners are about three times slower than a laptop: 180 s leaves room for
# the 18 s demo tests (one passed 60 s on a 3.12 runner, 2026-11-22).
timeout = 180
faulthandler_timeout = 300
markers = ["slow: takes most of a minute (deselected by default; `make test-all` runs it)"]
addopts = "-m 'not slow'"
filterwarnings = [
    # pandas 4 turns these into errors; fail now, while the fix is small.
    "error::pandas.errors.Pandas4Warning",
]

[dependency-groups]
dev = [
    "marimo>=0.14",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "types-geopandas>=1.0",
    "types-markdown>=3.11.3.20261108",
    "types-pyyaml>=6.0",
    "types-shapely>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B905"]  # paired columns of one table are the same length by construction

[tool.ruff.lint.per-file-ignores]
# A marimo cell shows the value of its last expression.
"notebooks/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["statsmodels.*", "scipy.*", "playwright.*"]  # playwright: run with --with
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
branch = true
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# The figure on 2026-11-16 (Python 3.12 and 3.14), rounded down; raise it as tests are added.
fail_under = 92
